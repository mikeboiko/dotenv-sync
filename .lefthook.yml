glob_matcher: doublestar

pre-commit:
  parallel: True
  skip:
    - rebase
  commands:
    prettier-format:
      glob: '**/*.{js,jsx,ts,tsx,json,css,scss,md,yaml,yml}'
      run: |
        echo "Formatting files with prettier..."
        npx prettier --write {staged_files}
      stage_fixed: true
    shfmt-format:
      glob: '**/*.{sh,bash}'
      run: |
        echo "Formatting shell scripts with shfmt..."
        shfmt --apply-ignore -w {staged_files}
      stage_fixed: true
    go-format:
      glob: '**/*.go'
      run: |
        echo "Formatting Go files with gofmt..."
        gofmt -w {staged_files}
      stage_fixed: true

post-commit:
  commands:
    install-local-ds:
      run: ./scripts/install-local-hook.sh

post-merge:
  commands:
    install-local-ds:
      run: ./scripts/install-local-hook.sh
